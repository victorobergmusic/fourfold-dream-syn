<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Fourfold Dream Synth</title>
<style>
  :root{
    --bg:#111;
    --panel:#1b1b1b;
    --panel2:#222;
    --text:#eee;
    --muted:#999;
    --line:#333;
    --accent:#ddd;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    touch-action:manipulation;
  }
  .app{max-width:1180px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:.08em}
  .subtitle{color:var(--muted);font-size:12px;margin-bottom:14px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  button{
    background:#262626;color:#eee;border:1px solid #444;border-radius:8px;
    padding:10px 14px;font:inherit;cursor:pointer
  }
  button.active{background:#eee;color:#111}
  .grid{display:grid;gap:10px}
  .voices{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bottom{grid-template-columns:1.25fr 1fr 1fr 1fr;margin-top:10px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .panel h2{font-size:13px;margin:0 0 10px;letter-spacing:.08em;color:#ccc}
  .control{display:grid;grid-template-columns:72px 1fr 48px;gap:8px;align-items:center;margin:8px 0}
  label{font-size:11px;color:#bbb}
  input[type=range]{width:100%;accent-color:#ddd}
  select{
    width:100%;background:#161616;color:#eee;border:1px solid #444;border-radius:6px;padding:6px
  }
  .value{font-size:10px;color:#888;text-align:right}
  .bigbtn{width:100%;margin-top:8px}
  .status{margin-top:12px;font-size:11px;color:#888;min-height:16px}
  .meter{height:5px;background:#292929;border-radius:4px;overflow:hidden;margin-top:8px}
  .meter > div{height:100%;width:0;background:#ddd}
  @media(max-width:900px){
    .voices{grid-template-columns:repeat(2,minmax(0,1fr))}
    .bottom{grid-template-columns:1fr 1fr}
  }
  @media(max-width:560px){
    .voices,.bottom{grid-template-columns:1fr}
    .control{grid-template-columns:70px 1fr 44px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>FOURFOLD DREAM SYNTH</h1>
  <div class="subtitle">Vermona-ish four voices + Subharmonicon/Marbles-ish generator + DAMAGE + HEAT + CLOUD</div>

  <div class="toolbar">
    <button id="start">START AUDIO</button>
    <button id="run">RUN SEQUENCER</button>
    <button id="randomize">RANDOMIZE</button>
    <button id="panic">PANIC</button>
  </div>

  <div class="grid voices" id="voices"></div>

  <div class="grid bottom">
    <section class="panel">
      <h2>GENERATE</h2>
      <div class="control"><label>PULSE</label><input id="pulse" type="range" min="40" max="280" value="108"><span class="value" id="pulseV"></span></div>
      <div class="control"><label>CHAOS</label><input id="chaos" type="range" min="0" max="1" step=".01" value=".34"><span class="value" id="chaosV"></span></div>
      <div class="control"><label>MEMORY</label><input id="memory" type="range" min="0" max="1" step=".01" value=".72"><span class="value" id="memoryV"></span></div>
      <div class="control"><label>MUTATE</label><input id="mutate" type="range" min="0" max="1" step=".01" value=".16"><span class="value" id="mutateV"></span></div>
      <div class="control"><label>GRAVITY</label><input id="gravity" type="range" min="0" max="1" step=".01" value=".72"><span class="value" id="gravityV"></span></div>
      <div class="control"><label>SPREAD</label><input id="spread" type="range" min="3" max="36" value="19"><span class="value" id="spreadV"></span></div>
      <div class="control"><label>RELATION</label><input id="relation" type="range" min="0" max="1" step=".01" value=".64"><span class="value" id="relationV"></span></div>
      <div class="control">
        <label>SCALE</label>
        <select id="scale">
          <option value="minorPent">minor pent</option>
          <option value="dorian">dorian</option>
          <option value="minor">minor</option>
          <option value="major">major</option>
          <option value="whole">whole tone</option>
        </select><span class="value"></span>
      </div>
    </section>

    <section class="panel">
      <h2>DAMAGE</h2>
      <div class="control"><label>TIME</label><input id="dmgTime" type="range" min=".025" max=".55" step=".005" value=".12"><span class="value" id="dmgTimeV"></span></div>
      <div class="control"><label>REPEAT</label><input id="dmgRepeat" type="range" min="0" max=".95" step=".01" value=".22"><span class="value" id="dmgRepeatV"></span></div>
      <div class="control"><label>SHIFT</label><input id="dmgShift" type="range" min="0" max="1" step=".01" value=".15"><span class="value" id="dmgShiftV"></span></div>
      <div class="control"><label>BREAK</label><input id="dmgBreak" type="range" min="0" max="1" step=".01" value=".08"><span class="value" id="dmgBreakV"></span></div>
      <button class="bigbtn" id="hold">HOLD / STUTTER</button>
    </section>

    <section class="panel">
      <h2>HEAT</h2>
      <div class="control"><label>DRIVE</label><input id="heatDrive" type="range" min="1" max="18" step=".1" value="3.0"><span class="value" id="heatDriveV"></span></div>
      <div class="control"><label>TONE</label><input id="heatTone" type="range" min="300" max="16000" value="9000"><span class="value" id="heatToneV"></span></div>
      <div class="control"><label>MIX</label><input id="heatMix" type="range" min="0" max="1" step=".01" value=".55"><span class="value" id="heatMixV"></span></div>
      <button class="bigbtn" id="burn">BURN</button>
    </section>

    <section class="panel">
      <h2>CLOUD</h2>
      <div class="control"><label>SPACE</label><input id="cloudSpace" type="range" min=".03" max=".8" step=".005" value=".27"><span class="value" id="cloudSpaceV"></span></div>
      <div class="control"><label>DENSITY</label><input id="cloudDensity" type="range" min="0" max=".95" step=".01" value=".44"><span class="value" id="cloudDensityV"></span></div>
      <div class="control"><label>DRIFT</label><input id="cloudDrift" type="range" min="0" max="1" step=".01" value=".28"><span class="value" id="cloudDriftV"></span></div>
      <div class="control"><label>DECAY</label><input id="cloudDecay" type="range" min="0" max=".94" step=".01" value=".72"><span class="value" id="cloudDecayV"></span></div>
      <button class="bigbtn" id="freeze">FREEZE</button>
    </section>
  </div>

  <div class="status" id="status">Press START AUDIO, then RUN SEQUENCER.</div>
  <div class="meter"><div id="meterBar"></div></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const scales = {
    minorPent:[0,3,5,7,10],
    dorian:[0,2,3,5,7,9,10],
    minor:[0,2,3,5,7,8,10],
    major:[0,2,4,5,7,9,11],
    whole:[0,2,4,6,8,10]
  };
  let ctx, master, seqTimer=null, step=0, running=false;
  let heatDry, heatWet, shaper, tone;
  let dmgDelay, dmgFb, dmgWet;
  let cloudA, cloudB, cloudFbA, cloudFbB, cloudWet;
  let meterNode, meterData, meterRAF;
  let hold=false, burn=false, freeze=false;

  const voiceState = Array.from({length:4}, (_,i)=>({
    tune:[0,7,12,19][i],
    shape:.2 + i*.16,
    cutoff:[1200,1700,2200,2800][i],
    res:.18,
    decay:[.24,.34,.48,.7][i],
    level:.18,
    div:[1,1.5,2,3][i],
    phase:0
  }));

  const pattern = Array.from({length:16},()=>Array(4).fill(null));

  function makeCurve(amount){
    const n=2048, curve=new Float32Array(n);
    const k=amount;
    for(let i=0;i<n;i++){
      const x=i*2/n-1;
      curve[i]=(1+k)*x/(1+k*Math.abs(x));
    }
    return curve;
  }

  function initAudio(){
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();

    master = ctx.createGain();
    master.gain.value=.7;

    const preFx = ctx.createGain();

    // Damage delay network
    dmgDelay = ctx.createDelay(1.5);
    dmgFb = ctx.createGain();
    dmgWet = ctx.createGain();
    dmgDelay.delayTime.value=.12;
    dmgFb.gain.value=.22;
    dmgWet.gain.value=.7;
    preFx.connect(dmgDelay);
    dmgDelay.connect(dmgFb).connect(dmgDelay);

    const afterDamage = ctx.createGain();
    preFx.connect(afterDamage);
    dmgDelay.connect(dmgWet).connect(afterDamage);

    // Heat parallel waveshaper
    heatDry=ctx.createGain();
    heatWet=ctx.createGain();
    shaper=ctx.createWaveShaper();
    tone=ctx.createBiquadFilter();
    tone.type='lowpass';
    tone.frequency.value=9000;
    shaper.curve=makeCurve(3);
    shaper.oversample='4x';
    afterDamage.connect(heatDry);
    afterDamage.connect(shaper).connect(tone).connect(heatWet);

    const afterHeat=ctx.createGain();
    heatDry.connect(afterHeat);
    heatWet.connect(afterHeat);

    // "Cloud": cross-coupled diffused dual delay
    cloudA=ctx.createDelay(1.2);
    cloudB=ctx.createDelay(1.2);
    cloudFbA=ctx.createGain();
    cloudFbB=ctx.createGain();
    cloudWet=ctx.createGain();
    const cloudHP=ctx.createBiquadFilter();
    cloudHP.type='highpass'; cloudHP.frequency.value=180;

    afterHeat.connect(master);
    afterHeat.connect(cloudA);
    afterHeat.connect(cloudB);
    cloudA.connect(cloudFbA).connect(cloudB);
    cloudB.connect(cloudFbB).connect(cloudA);
    cloudA.connect(cloudWet);
    cloudB.connect(cloudWet);
    cloudWet.connect(cloudHP).connect(master);

    meterNode=ctx.createAnalyser();
    meterNode.fftSize=256;
    meterData=new Uint8Array(meterNode.frequencyBinCount);
    master.connect(meterNode).connect(ctx.destination);

    window.preFx=preFx;
    updateFx();
    startMeter();
  }

  function startMeter(){
    const bar=$('meterBar');
    const loop=()=>{
      if(!meterNode) return;
      meterNode.getByteTimeDomainData(meterData);
      let sum=0;
      for(const v of meterData){ const x=(v-128)/128; sum+=x*x; }
      const rms=Math.sqrt(sum/meterData.length);
      bar.style.width=Math.min(100,rms*280)+'%';
      meterRAF=requestAnimationFrame(loop);
    };
    loop();
  }

  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

  function noteForVoice(v, s){
    const sc=scales[$('scale').value];
    const spread=+$('spread').value;
    const gravity=+$('gravity').value;
    const relation=+$('relation').value;
    const root=48;

    const independentDegree=Math.floor(Math.random()*sc.length);
    const independentOct=Math.floor((Math.random()*spread)/12);
    let independent=root+sc[independentDegree]+12*independentOct;

    const ratioSteps=[0,7,12,19];
    const related=root+ratioSteps[v]+(s%4===0?0:(Math.random()<.25?12:0));
    let raw=independent*(1-relation)+related*relation;

    if(Math.random()<gravity){
      const nearest=sc.reduce((best,d)=>{
        const candidate=root + d + 12*Math.round((raw-root-d)/12);
        return Math.abs(candidate-raw)<Math.abs(best-raw)?candidate:best;
      },root);
      raw=nearest;
    }
    return Math.round(raw)+voiceState[v].tune;
  }

  function triggerVoice(v, midi, velocity=.8){
    if(!ctx || !window.preFx) return;
    const now=ctx.currentTime;
    const st=voiceState[v];

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    const filt=ctx.createBiquadFilter();
    const drive=ctx.createWaveShaper();

    const types=['sine','triangle','sawtooth','square'];
    const idx=Math.min(3,Math.floor(st.shape*4));
    osc.type=types[idx];
    osc.frequency.setValueAtTime(mtof(midi),now);

    filt.type='lowpass';
    filt.frequency.setValueAtTime(st.cutoff,now);
    filt.Q.setValueAtTime(1+st.res*18,now);
    filt.frequency.exponentialRampToValueAtTime(Math.max(90,st.cutoff*.35),now+st.decay*.9);

    drive.curve=makeCurve(1.2+st.shape*3);
    drive.oversample='2x';

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0002,st.level*velocity),now+.008);
    gain.gain.exponentialRampToValueAtTime(.0001,now+st.decay);

    osc.connect(drive).connect(filt).connect(gain).connect(window.preFx);
    osc.start(now); osc.stop(now+st.decay+.05);

    // occasional sub oscillator
    if(st.shape>.5){
      const sub=ctx.createOscillator(), sg=ctx.createGain();
      sub.type='sine'; sub.frequency.value=mtof(midi-12);
      sg.gain.setValueAtTime(.0001,now);
      sg.gain.exponentialRampToValueAtTime(st.level*.12,now+.01);
      sg.gain.exponentialRampToValueAtTime(.0001,now+st.decay*.9);
      sub.connect(sg).connect(filt);
      sub.start(now); sub.stop(now+st.decay+.05);
    }
  }

  function tick(){
    const chaos=+$('chaos').value;
    const memory=+$('memory').value;
    const mutate=+$('mutate').value;

    for(let v=0;v<4;v++){
      const div=voiceState[v].div;
      const active=((step % Math.max(1,Math.round(div*2)))===0) || Math.random()<chaos*.14;
      if(!active) continue;

      let note=pattern[step][v];
      const shouldRegenerate = note===null || Math.random()>(memory) || Math.random()<mutate*.18;
      if(shouldRegenerate){
        note=noteForVoice(v,step);
        pattern[step][v]=note;
      }
      if(Math.random() < .78 + chaos*.12){
        triggerVoice(v,note,.55+Math.random()*.45);
      }
    }

    // data-bender-ish random "faults"
    const br=+$('dmgBreak').value;
    if(Math.random()<br*.22){
      const now=ctx.currentTime;
      const base=+$('dmgTime').value;
      dmgDelay.delayTime.cancelScheduledValues(now);
      dmgDelay.delayTime.setTargetAtTime(Math.max(.01,base*(.25+Math.random()*2.5)),now,.006);
    }

    // cloud drift
    const drift=+$('cloudDrift').value;
    const base=+$('cloudSpace').value;
    if(drift>0){
      const now=ctx.currentTime;
      cloudA.delayTime.setTargetAtTime(Math.max(.01,base*(.82+Math.random()*.36*drift)),now,.08);
      cloudB.delayTime.setTargetAtTime(Math.max(.01,base*1.37*(.82+Math.random()*.36*drift)),now,.08);
    }

    step=(step+1)%16;
  }

  function startSeq(){
    if(!ctx) initAudio();
    if(ctx.state==='suspended') ctx.resume();
    if(running) return;
    running=true;
    $('run').classList.add('active');
    $('run').textContent='STOP SEQUENCER';

    const loop=()=>{
      if(!running) return;
      tick();
      const bpm=+$('pulse').value;
      const ms=(60000/bpm)/2;
      seqTimer=setTimeout(loop,ms);
    };
    loop();
  }
  function stopSeq(){
    running=false; clearTimeout(seqTimer);
    $('run').classList.remove('active');
    $('run').textContent='RUN SEQUENCER';
  }

  function updateFx(){
    if(!ctx) return;
    dmgDelay.delayTime.setTargetAtTime(+$('dmgTime').value,ctx.currentTime,.02);
    dmgFb.gain.setTargetAtTime(hold ? .94 : +$('dmgRepeat').value,ctx.currentTime,.02);
    dmgWet.gain.setTargetAtTime(.25 + +$('dmgShift').value*.8,ctx.currentTime,.03);

    const drive = burn ? +$('heatDrive').value*2.4 : +$('heatDrive').value;
    shaper.curve=makeCurve(drive);
    tone.frequency.setTargetAtTime(burn ? Math.max(500,+$('heatTone').value*.35) : +$('heatTone').value,ctx.currentTime,.04);
    heatWet.gain.setTargetAtTime(+$('heatMix').value,ctx.currentTime,.03);
    heatDry.gain.setTargetAtTime(1-+$('heatMix').value*.55,ctx.currentTime,.03);

    const decay=freeze ? .985 : +$('cloudDecay').value;
    cloudFbA.gain.setTargetAtTime(decay,ctx.currentTime,.04);
    cloudFbB.gain.setTargetAtTime(decay*.97,ctx.currentTime,.04);
    cloudWet.gain.setTargetAtTime(.12 + +$('cloudDensity').value*.42,ctx.currentTime,.04);
    const space=+$('cloudSpace').value;
    cloudA.delayTime.setTargetAtTime(space,ctx.currentTime,.05);
    cloudB.delayTime.setTargetAtTime(Math.min(1.1,space*1.37+.011),ctx.currentTime,.05);
  }

  function buildVoices(){
    const root=$('voices');
    const defs=[
      ['TUNE','tune',-12,24,1],
      ['SHAPE','shape',0,1,.01],
      ['CUTOFF','cutoff',120,9000,1],
      ['RES','res',0,1,.01],
      ['DECAY','decay',.05,2.5,.01],
      ['LEVEL','level',.02,.32,.01],
      ['DIV','div',.5,4,.5]
    ];
    voiceState.forEach((st,i)=>{
      const p=document.createElement('section');
      p.className='panel';
      p.innerHTML=`<h2>VOICE ${i+1}</h2>`;
      defs.forEach(([name,key,min,max,stepv])=>{
        const row=document.createElement('div');
        row.className='control';
        row.innerHTML=`<label>${name}</label><input type="range" min="${min}" max="${max}" step="${stepv}" value="${st[key]}"><span class="value"></span>`;
        const inp=row.querySelector('input'), val=row.querySelector('.value');
        const render=()=>{ st[key]=+inp.value; val.textContent=Number(st[key]).toFixed(stepv<1?2:0); };
        inp.addEventListener('input',render); render();
        p.appendChild(row);
      });
      const trig=document.createElement('button');
      trig.className='bigbtn'; trig.textContent='TRIGGER';
      trig.onclick=()=>{ if(!ctx)initAudio(); ctx.resume(); triggerVoice(i,60+st.tune,.9); };
      p.appendChild(trig);
      root.appendChild(p);
    });
  }

  function bindValue(id,fmt=x=>x){
    const el=$(id), out=$(id+'V');
    if(!el||!out) return;
    const f=()=>{ out.textContent=fmt(+el.value); updateFx(); };
    el.addEventListener('input',f); f();
  }

  buildVoices();
  [
    ['pulse',x=>Math.round(x)+' bpm'],['chaos',x=>x.toFixed(2)],['memory',x=>x.toFixed(2)],
    ['mutate',x=>x.toFixed(2)],['gravity',x=>x.toFixed(2)],['spread',x=>Math.round(x)+' st'],
    ['relation',x=>x.toFixed(2)],['dmgTime',x=>x.toFixed(3)+' s'],['dmgRepeat',x=>x.toFixed(2)],
    ['dmgShift',x=>x.toFixed(2)],['dmgBreak',x=>x.toFixed(2)],['heatDrive',x=>x.toFixed(1)],
    ['heatTone',x=>Math.round(x)+' Hz'],['heatMix',x=>x.toFixed(2)],['cloudSpace',x=>x.toFixed(3)+' s'],
    ['cloudDensity',x=>x.toFixed(2)],['cloudDrift',x=>x.toFixed(2)],['cloudDecay',x=>x.toFixed(2)]
  ].forEach(([id,fmt])=>bindValue(id,fmt));

  $('start').onclick=async()=>{
    initAudio(); await ctx.resume();
    $('start').classList.add('active');
    $('status').textContent='Audio running. Trigger voices or start the sequencer.';
  };
  $('run').onclick=()=> running?stopSeq():startSeq();

  $('randomize').onclick=()=>{
    voiceState.forEach(st=>{
      st.tune=[0,3,5,7,10,12,15,19][Math.floor(Math.random()*8)] - (Math.random()<.35?12:0);
      st.shape=Math.random();
      st.cutoff=400+Math.random()*5000;
      st.res=Math.random()*.7;
      st.decay=.12+Math.random()*1.1;
      st.level=.10+Math.random()*.13;
      st.div=[.5,1,1.5,2,2.5,3,4][Math.floor(Math.random()*7)];
    });
    for(let s=0;s<16;s++) for(let v=0;v<4;v++) pattern[s][v]=null;
    location.hash='r'+Date.now();
    $('status').textContent='Randomized engine state. Reload page to reset the visible voice sliders.';
  };

  $('panic').onclick=()=>{
    stopSeq();
    if(master && ctx){
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(0,ctx.currentTime);
      master.gain.linearRampToValueAtTime(.7,ctx.currentTime+.08);
    }
  };

  $('hold').onclick=()=>{ hold=!hold; $('hold').classList.toggle('active',hold); updateFx(); };
  $('burn').onclick=()=>{ burn=!burn; $('burn').classList.toggle('active',burn); updateFx(); };
  $('freeze').onclick=()=>{ freeze=!freeze; $('freeze').classList.toggle('active',freeze); updateFx(); };

  // Computer keyboard audition
  const keys={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72};
  window.addEventListener('keydown',e=>{
    if(e.repeat||keys[e.key]===undefined) return;
    if(!ctx)initAudio(); ctx.resume();
    const v=(keys[e.key]-60)%4;
    triggerVoice(v,keys[e.key],.9);
  });
})();
</script>
</body>
</html>
